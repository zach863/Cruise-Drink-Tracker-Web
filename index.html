<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cruise Drink Tracker</title>
  <meta name="description" content="Official site for Cruise Drink Tracker app information and policies." />

  <style>
    :root { color-scheme: dark; }

    body{
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0b0f14;
      color: #e6edf3;
      line-height: 1.55;
    }

    a{ color: inherit; text-decoration: none; }
    a:hover{ text-decoration: underline; }

    main{
      max-width: 860px;
      margin: 0 auto;
      padding: 56px 16px 72px;
    }

    .hero{
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
    }

    .icon{
      width: 72px;
      height: 72px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      object-fit: cover;
      background: rgba(255,255,255,.06);
    }

    h1{
      margin: 0;
      font-size: 30px;
      letter-spacing: -0.02em;
    }

    .sub{
      margin: 6px 0 0;
      color: rgba(230,237,243,.78);
      font-size: 15px;
    }

    .grid{
      margin-top: 22px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .card{
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(6px);
    }

    .card h2{
      margin: 0 0 8px;
      font-size: 16px;
      color: rgba(230,237,243,.92);
    }

    .link{
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.03);
    }

    .link:hover{
      background: rgba(255,255,255,.06);
      text-decoration: none;
    }

    .arrow{
      opacity: .9;
      font-size: 14px;
      transform: translateY(-1px);
    }

    footer{
      margin-top: 28px;
      color: rgba(230,237,243,.55);
      font-size: 13px;
    }

    /* If you want a subtle top glow */
    .glow{
      position: fixed;
      inset: -200px -200px auto -200px;
      height: 420px;
      background: radial-gradient(closest-side, rgba(88,166,255,.18), transparent 70%);
      pointer-events: none;
      filter: blur(10px);
      opacity: .9;
    }
  </style>
</head>

<body>
  <div class="glow" aria-hidden="true"></div>

  <main>
    <section class="hero">
      <img class="icon" src="/AppIcon.png" alt="Cruise Drink Tracker app icon" />
      <div>
        <h1>Cruise Drink Tracker</h1>
        <p class="sub">Official site for app information and policies.</p>
      </div>
    </section>

    <section class="grid">
      <div class="card">
        <h2>Privacy</h2>
        <a class="link" href="/privacy.html">
          <span>View Privacy Policy</span>
          <span class="arrow">→</span>
        </a>
      </div>

      <div class="card">
        <h2>Support</h2>
        <a class="link" href="mailto:info@cruisedrinktracker.com">
          <span>Email: info@cruisedrinktracker.com</span>
          <span class="arrow">→</span>
        </a>
      </div>
    </section>

    <footer>
      <p>Cruise Drink Tracker is owned and operated by Diamond JZ Ventures LLC.</p>
      <p>© <span id="year"></span> Diamond JZ Ventures LLC</p>
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
